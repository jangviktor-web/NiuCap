# ============================================================================
# Cloudflare Tunnel 配置模板（具名隧道，稳定域名 + 访问控制）
#
# 相比 ./deploy.sh tunnel 的「快速隧道」（地址每次重启都变、无访问控制），
# 这个配置能给你一个固定的域名，并且能加登录保护。
#
# ---------------------------------------------------------------------------
# 前置：你需要一个域名，并托管在 Cloudflare（免费套餐即可）
# ---------------------------------------------------------------------------
#
# 一次性设置（每条命令只需跑一次）：
#
#   1) 登录授权
#      cloudflared tunnel login
#
#   2) 创建隧道（名字随便起，比如 tick）
#      cloudflared tunnel create tick
#      → 输出里会有一个 Tunnel ID 和一个凭据文件路径，记下来
#
#   3) 把域名指向隧道（假设你的域名是 example.com，想用 tick.example.com）
#      cloudflared tunnel route dns tick tick.example.com
#
#   4) 复制本文件为正式配置：
#      cp cloudflared.example.yml ~/.cloudflared/config.yml
#      然后把下面 <TUNNEL-ID> 和 <你的用户名> 替换成实际值
#
#   5) 启动
#      cloudflared tunnel run tick
#
# ============================================================================

tunnel: <TUNNEL-ID>
credentials-file: /root/.cloudflared/<TUNNEL-ID>.json

ingress:
  # ---- 主站：指向本机服务 ----
  - hostname: tick.example.com
    service: http://127.0.0.1:8899
    originRequest:
      # 行情接口偶尔要跑几秒，放宽超时
      connectTimeout: 30s
      noTLSVerify: true

  # ---- 兜底规则（必须有，且必须是最后一条）----
  - service: http_status:404

# ============================================================================
# 访问控制（二选一，建议至少开一个）
# ============================================================================
#
# 【方案 A】Cloudflare Access —— 邮箱验证码登录（推荐，免费）
#
#   在 Cloudflare 后台 → Zero Trust → Access → Applications
#   新建一个 Self-hosted 应用，域名填 tick.example.com
#   策略选 "Allow"，条件选 "Emails"，填入你和朋友的邮箱
#
#   效果：访问时会先要求输入邮箱 + 收验证码，通过后才能进面板。
#        这样即使别人拿到链接也进不来。
#
# 【方案 B】应用内置账号 —— 已经在面板里做好了
#
#   面板自带注册/登录（用户名 + 密码），每个账号的自选股和虚拟盘互相隔离。
#   适合「信任链接、只需要数据分家」的场景。
#
#   注意：内置账号不阻止别人访问页面本身，只是数据分开。
#        如果链接可能外泄，建议再叠加方案 A。
#
# ============================================================================
# 后台常驻（可选）
# ============================================================================
#
#   Linux（systemd）：
#     sudo cloudflared service install
#     sudo systemctl enable --now cloudflared
#
#   macOS（brew）：
#     sudo brew services start cloudflared
#
# ============================================================================
